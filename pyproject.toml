[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covalent-onchain-compute"
version = "1.0.0"
description = "On-chain forensic analysis of a GPU-backed synthetic dollar (USD.AI) with Covalent GoldRush"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Uwe Jens Cerron" }]
dependencies = ["requests>=2.31,<3", "eth-abi>=5,<7", "pycryptodome>=3.19", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pyflakes>=3"]

[project.scripts]
compute-forensics = "compute_forensics.cli:main"

[tool.setuptools.packages.find]
include = ["compute_forensics*"]
